[package]
name = "audino"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bincode = "1.3.3"
crossterm = "0.29.0"
image = "0.25.10"
libmpv2 = "6.0.0"
lofty = "0.24.0"
rand = "0.10.1"
ratatui = "0.30.1"
ratatui-image = { version = "11.0.4", default-features = false, features = ["crossterm", "image-defaults"] }
serde = { version = "1.0.228", features = ["derive"] }
souvlaki = "0.8.3"
unicode-width = "0.2.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
